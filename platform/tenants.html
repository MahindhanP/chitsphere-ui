<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tenants · ChitSphere Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-portal="platform" data-page="tenants">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a href="dashboard.html">Platform</a><i data-i="chevR"></i>Tenants</div>
      <h1>Tenants</h1>
      <p>Every organisation on ChitSphere. <span class="api">GET /api/platform/v1/admin/tenants</span></p>
    </div>
    <div class="actions"><a class="btn primary" href="tenant-new.html"><i data-i="plus"></i>New tenant</a></div>
  </div>
  <div class="card">
    <div class="toolbar">
      <div class="input-icon"><i data-i="search"></i><input class="input" id="q" placeholder="Search name, code, email, city…"></div>
      <select class="select" id="fStatus"></select>
      <select class="select" id="fSub"></select>
      <select class="select" id="fPlan"></select>
    </div>
    <div id="tbl"></div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  $('fStatus').innerHTML = UI.options({ enum: 'TenantStatus', blank: 'All tenant statuses' });
  $('fSub').innerHTML = UI.options({ enum: 'SubscriptionStatus', blank: 'All subscriptions' });
  $('fPlan').innerHTML = UI.options({ options: DB.plans.map(function (p) { return [p.code, p.name]; }), blank: 'All plans' });
  var rows = DB.tenants.map(function (t) { return Object.assign({ subStatus: t.sub ? t.sub.status : '', city: t.address.city }, t); });
  UI.table({
    el: '#tbl', rows: rows, search: '#q', searchKeys: ['name', 'code', 'contactEmail', 'city', 'legalName'], pageSize: 10,
    filters: [{ el: '#fStatus', key: 'status' }, { el: '#fSub', key: 'subStatus' }, { el: '#fPlan', key: 'planCode' }],
    onRow: function (t) { location.href = 'tenant-view.html?id=' + t.id; },
    columns: [
      { key: 'name', label: 'Tenant', sort: true, render: function (t) { return UI.ent(t.name, '<span class="mono">' + t.code + '</span> · ' + UI.esc(t.city), null, t.color); } },
      { key: 'status', label: 'Status', sort: true, render: function (t) { return UI.badge(t.status); } },
      { key: 'planCode', label: 'Plan', sort: true, render: function (t) { return t.planName ? t.planName + ' <span class="xs muted">v' + t.sub.planVersion + '</span>' : '<span class="muted">No plan</span>'; } },
      { key: 'subStatus', label: 'Subscription', render: function (t) { return t.sub ? UI.badge(t.sub.status) + '<div class="xs muted">' + (t.sub.trialEndsOn ? 'Trial ends ' + UI.date(t.sub.trialEndsOn) : t.sub.endsOn ? 'Ends ' + UI.date(t.sub.endsOn) : '') + '</div>' : '—'; } },
      { key: 'members', label: 'Members', num: true, sort: true },
      { key: 'contactEmail', label: 'Contact', render: function (t) { return UI.esc(t.contactEmail); } },
      { key: 'createdAt', label: 'Created', sort: true, render: function (t) { return UI.date(t.createdAt); } },
      { key: 'x', label: '', cls: 'actions-cell', render: function (t) { return '<a class="icon-btn sm" href="tenant-view.html?id=' + t.id + '" aria-label="Open">' + UI.icon('chevR') + '</a>'; } }
    ]
  });
});
</script>
</body>
</html>
