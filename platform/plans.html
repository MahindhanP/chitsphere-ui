<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plans · ChitSphere Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<!--
  GET /api/platform/v1/admin/plans (plan-summary). A plan is versioned: new subscriptions get the
  published version; edits go to a draft that is published as the next version.
-->
<body data-portal="platform" data-page="plans">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a href="dashboard.html">Platform</a><i data-i="chevR"></i>Plans</div>
      <h1>Plans & versions</h1>
      <p>What each plan sells: modules from the capability catalog, limits and commercial terms.</p>
    </div>
    <div class="actions"><button class="btn primary" id="newPlan"><i data-i="plus"></i>New plan</button></div>
  </div>
  <div class="grid g-3" id="cards"></div>
  <div class="card mt-4">
    <div class="toolbar"><div class="input-icon"><i data-i="search"></i><input class="input" id="q" placeholder="Search plans…"></div><select class="select" id="fStatus"></select></div>
    <div id="tbl"></div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  $('cards').innerHTML = DB.plans.filter(function (p) { return p.status === 'ACTIVE'; }).map(function (p) {
    var mods = DB.planModules(p);
    var prods = DB.catalog.filter(function (c) { return !c.always && c.modules.some(function (m) { return mods.indexOf(m.id) > -1; }); }).map(function (c) { return c.label; });
    return '<a class="card" href="plan-view.html?id=' + p.id + '" style="color:inherit;text-decoration:none"><div class="card-body stack"><div class="row between"><b style="font-size:16px">' + p.name + '</b>' + UI.badge(p.status) + '</div>' +
      '<div style="font-size:22px;font-weight:700">' + UI.inr(p.price) + ' <span class="xs muted">/ ' + UI.human(p.billingCycle).toLowerCase() + '</span></div>' +
      '<div class="xs muted">v' + p.publishedVersion + ' published · ' + p.subscribers + ' subscribers' + (p.hasDraft ? ' · <b style="color:var(--warning)">draft v' + p.draft.number + '</b>' : '') + '</div>' +
      '<div class="row wrap">' + prods.map(function (x) { return '<span class="badge outline">' + x + '</span>'; }).join('') + '</div></div></a>';
  }).join('');
  $('fStatus').innerHTML = UI.options({ enum: 'PlanStatus', blank: 'All statuses' });
  UI.table({
    el: '#tbl', rows: DB.plans, search: '#q', searchKeys: ['code', 'name', 'description'], filters: [{ el: '#fStatus', key: 'status' }],
    onRow: function (p) { location.href = 'plan-view.html?id=' + p.id; },
    columns: [
      { key: 'name', label: 'Plan', sort: true, render: function (p) { return '<b>' + p.name + '</b><div class="xs muted mono">' + p.code + '</div>'; } },
      { key: 'status', label: 'Status', render: function (p) { return UI.badge(p.status); } },
      { key: 'publishedVersion', label: 'Published', render: function (p) { return p.publishedVersion ? 'v' + p.publishedVersion : '<span class="muted">Never</span>'; } },
      { key: 'hasDraft', label: 'Draft', render: function (p) { return p.hasDraft ? '<span class="badge warning">Draft' + (p.draft ? ' v' + p.draft.number : '') + '</span>' : '—'; } },
      { key: 'price', label: 'Price', num: true, sort: true, render: function (p) { return UI.inr(p.price) + '<div class="xs muted">' + UI.human(p.billingCycle) + '</div>'; } },
      { key: 'trialDays', label: 'Trial', num: true, render: function (p) { return p.trialDays + ' d'; } },
      { key: 'subscribers', label: 'Subscribers', num: true, sort: true },
      { key: 'updatedAt', label: 'Updated', render: function (p) { return UI.date(p.updatedAt); } }
    ]
  });
  $('newPlan').addEventListener('click', function () {
    UI.dialog({ title: 'New plan', icon: 'layers', sub: 'Creates the plan with draft version 1. Publish it to sell it.', api: 'POST /api/platform/v1/admin/plans', wide: true, ok: 'Create plan',
      fields: [{ id: 'code', label: 'Code', req: true, mono: true, pattern: '[A-Za-z][A-Za-z0-9_]{2,39}', err: 'Starts with a letter; 3–40 letters, digits or _', placeholder: 'GROWTH_PLUS' }, { id: 'name', label: 'Name', req: true, maxlength: 120 },
        { id: 'description', label: 'Description', type: 'textarea', span: 2, maxlength: 1000 },
        { section: 'Terms (draft v1)' }, { id: 'price', label: 'Price (INR)', type: 'number', req: true, min: 0 }, { id: 'billingCycle', label: 'Billing cycle', type: 'select', enum: 'BillingCycle' }, { id: 'trialDays', label: 'Trial days', type: 'number', min: 0, value: 14 }],
      onOk: function (v) { setTimeout(function () { location.href = 'plan-view.html?id=pl-hr'; }, 600); }, done: 'Plan created as a draft' });
  });
});
</script>
</body>
</html>
