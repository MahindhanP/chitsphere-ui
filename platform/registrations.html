<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration requests · ChitSphere Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-portal="platform" data-page="registrations">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a href="tenants.html">Tenants</a><i data-i="chevR"></i>Registration requests</div>
      <h1>Registration requests</h1>
      <p>Organisations that signed up on chitsphere.in. Approving one activates its admin console and member app.</p>
    </div>
    <div class="actions"><a class="btn" href="../register.html" target="_blank"><i data-i="external"></i>Open public sign-up</a></div>
  </div>

  <div class="card">
    <div class="tabs" data-tabs id="rTabs" style="padding:0 12px"></div>
    <div class="toolbar"><div class="input-icon"><i data-i="search"></i><input class="input" id="q" placeholder="Search organisation, admin, reg. no…"></div>
      <select class="select hidden" id="fStatus"><option value=""></option><option>New</option><option>In review</option><option>Approved</option><option>Rejected</option></select>
      <span class="ml-auto small muted">Target: review within 2 working days</span></div>
    <div id="tbl"></div>
  </div>
</main>

<div class="drawer wide" id="rDrawer" role="dialog" aria-label="Review registration">
  <div class="drawer-head"><span class="avatar sq" id="dAv"></span><div style="flex:1;min-width:0"><h3 id="dName"></h3><div class="xs muted" id="dMeta"></div></div><button class="icon-btn" data-close aria-label="Close"><i data-i="x"></i></button></div>
  <div class="drawer-body stack-lg">
    <div class="calc-strip" id="dStrip"></div>
    <div><h4 class="mb-2">Automated checks</h4><div class="card list" style="box-shadow:none" id="dChecks"></div></div>
    <div><h4 class="mb-2">Documents</h4><div class="card list" style="box-shadow:none" id="dDocs"></div></div>
    <div><h4 class="mb-2">Details</h4><dl class="kv small" id="dKv"></dl></div>
    <div class="field"><label>Note to applicant</label><textarea class="textarea" id="dNote" placeholder="Required when requesting changes or rejecting"></textarea></div>
  </div>
  <div class="drawer-foot">
    <button class="btn danger-ghost" style="margin-right:auto" data-act="reject"><i data-i="x"></i>Reject</button>
    <button class="btn" data-act="changes"><i data-i="send"></i>Request changes</button>
    <button class="btn primary" data-act="approve"><i data-i="check"></i>Approve & activate</button>
  </div>
</div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var R = DB.registrations, $ = function (id) { return document.getElementById(id); }, cur;
  var tabs = [['', 'All'], ['New', 'New'], ['In review', 'In review'], ['Approved', 'Approved'], ['Rejected', 'Rejected']];
  $('rTabs').innerHTML = tabs.map(function (t, i) {
    return '<button class="' + (i === 0 ? 'active' : '') + '" data-tab="' + t[0] + '">' + t[1] + ' <span class="count">' + R.filter(function (r) { return !t[0] || r.status === t[0]; }).length + '</span></button>';
  }).join('');
  $('rTabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (!b) return; $('fStatus').value = b.getAttribute('data-tab'); $('fStatus').dispatchEvent(new Event('change')); });
  var badge = { 'New': 'info', 'In review': 'warning', 'Approved': 'success', 'Rejected': 'danger' };

  var tbl = UI.table({
    el: '#tbl', rows: R, search: '#q', searchKeys: ['name', 'admin', 'regNo', 'city', 'id'], filters: [{ el: '#fStatus', key: 'status' }],
    onRow: function (r) { open(r); },
    columns: [
      { key: 'name', label: 'Organisation', sort: true, render: function (r) { return '<div class="ent"><span class="avatar sq sm">' + UI.initials(r.name) + '</span><div class="ent-txt"><b>' + r.name + '</b><span>' + r.id + ' · ' + r.city + ', ' + r.state + '</span></div></div>'; } },
      { key: 'admin', label: 'Applicant', render: function (r) { return r.admin + '<div class="xs muted">' + r.email + '</div>'; } },
      { key: 'slug', label: 'Requested address', render: function (r) { return '<span class="mono small">' + r.slug + '.chitsphere.in</span>'; } },
      { key: 'plan', label: 'Plan', render: function (r) { return '<span class="badge outline">' + DB.plan(r.plan).name + '</span>'; } },
      { key: 'docs', label: 'Docs', render: function (r) { return r.docs + '/4'; } },
      { key: 'submitted', label: 'Submitted', sort: true, render: function (r) { return UI.date(r.submitted); } },
      { key: 'status', label: 'Status', sort: true, render: function (r) { return '<span class="badge dot ' + badge[r.status] + '">' + r.status + '</span>'; } },
      { key: 'x', label: '', cls: 'actions-cell', render: function (r) { return r.status === 'New' || r.status === 'In review' ? '<button class="btn sm soft">Review</button>' : '<button class="btn sm ghost">View</button>'; } }
    ]
  });

  function open(r) {
    cur = r;
    $('dAv').textContent = UI.initials(r.name);
    $('dName').textContent = r.name;
    $('dMeta').innerHTML = r.id + ' · submitted ' + UI.date(r.submitted) + ' · <span class="badge dot ' + badge[r.status] + '">' + r.status + '</span>';
    $('dStrip').innerHTML = [['Console', r.slug + '.chitsphere.in'], ['App code', r.slug.toUpperCase()], ['Plan', DB.plan(r.plan).name + ' (trial)']].map(function (c) { return '<div><span>' + c[0] + '</span><b class="mono" style="font-size:13px">' + c[1] + '</b></div>'; }).join('');
    var bad = r.status === 'Rejected';
    var checks = [['Chit registration found in Registrar records', !bad], ['PAN format & name match', !bad], ['GSTIN active', !!r.gstin], ['No duplicate organisation on platform', true], ['Admin mobile verified by OTP', true], ['Email domain matches company', r.email.indexOf('mailinator') < 0]];
    $('dChecks').innerHTML = checks.map(function (c) {
      return '<div class="list-item" style="padding:10px 14px"><span style="color:var(--' + (c[1] ? 'success' : 'warning') + ')">' + UI.icon(c[1] ? 'checkCircle' : 'alert') + '</span><span class="small" style="flex:1">' + c[0] + '</span><span class="xs muted">' + (c[1] ? 'Passed' : 'Check manually') + '</span></div>';
    }).join('');
    var docs = ['Chit registration certificate', 'Certificate of incorporation', 'PAN card', 'GST certificate'];
    $('dDocs').innerHTML = docs.map(function (d, i) {
      var has = i < r.docs;
      return '<div class="list-item" style="padding:10px 14px"><span class="card-title-icon" style="width:30px;height:30px">' + UI.icon('file', 'sm') + '</span><div style="flex:1"><b class="small">' + d + '</b><div class="xs muted">' + (has ? 'PDF · 1.' + (i + 2) + ' MB' : 'Not uploaded') + '</div></div>' +
        (has ? '<button class="btn sm ghost">' + UI.icon('eye') + 'View</button><label class="check xs"><input type="checkbox"' + (r.status === 'Approved' ? ' checked' : '') + '>Verified</label>' : '<span class="badge warning">Missing</span>') + '</div>';
    }).join('');
    $('dKv').innerHTML = [['Reg. no.', r.regNo], ['PAN', r.pan], ['GSTIN', r.gstin || '—'], ['Applicant', r.admin], ['Email', r.email], ['Mobile', r.mobile]].map(function (k) { return '<dt>' + k[0] + '</dt><dd>' + k[1] + '</dd>'; }).join('');
    $('dNote').value = r.note;
    var done = r.status === 'Approved' || r.status === 'Rejected';
    document.querySelectorAll('#rDrawer [data-act]').forEach(function (b) { b.classList.toggle('hidden', done); });
    UI.open('#rDrawer');
  }

  document.querySelector('#rDrawer .drawer-foot').addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    if (act !== 'approve' && !$('dNote').value.trim()) { $('dNote').closest('.field').classList.add('invalid'); $('dNote').focus(); UI.toast('Add a note for the applicant', 'danger'); return; }
    cur.status = { approve: 'Approved', changes: 'In review', reject: 'Rejected' }[act];
    UI.close(); tbl.render();
    UI.toast({
      approve: '<b>' + cur.name + '</b> approved. Console activated at ' + cur.slug + '.chitsphere.in and sign-in details emailed to ' + cur.admin + '.',
      changes: 'Change request sent to ' + cur.admin,
      reject: cur.name + ' rejected. The applicant has been notified.'
    }[act], act === 'reject' ? 'warning' : 'success');
  });
});
</script>
</body>
</html>
