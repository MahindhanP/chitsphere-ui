<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Books & periods · Accounting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<!--
  GET /book; POST /book {code, name, template, fiscalYearStartMonth, booksFrom, gstin, cashSharePolicy, allowSelfApproval} (once);
  PUT /book {name, gstin, cashSharePolicy, allowSelfApproval, version}; GET /periods, POST /periods/{id}/close | /reopen, POST /fiscal-years/next;
  GET/POST /approval-policies {name, voucherType, templateCode, sourceSystem, minAmount, maxAmount, levels[≤3], priority},
  POST /approval-policies/{id}/deactivate (policies are never edited: deactivate and create a replacement).
-->
<body data-portal="auto" data-page="acc-setup">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a class="home" href="#">Home</a><i data-i="chevR"></i>Accounting<i data-i="chevR"></i>Books & periods</div>
      <h1>Books & periods</h1>
      <p id="sub"></p>
    </div>
  </div>
  <div class="card"><div class="tabs" data-tabs><button data-tab="bk" class="active">Book settings</button><button data-tab="pd">Periods</button><button data-tab="ap">Approval policies</button></div></div>
  <div data-tab-panel="bk" class="active mt-4"><div class="grid g-main-side"><div class="card"><div class="card-head"><h3>Settings</h3></div><div class="card-body" id="bkForm"></div><div class="card-foot"><button class="btn primary" id="saveBk"><i data-i="save"></i>Save</button></div></div><div class="card"><div class="card-head"><h3>Fixed at setup</h3></div><div class="card-body" id="bkFixed"></div></div></div></div>
  <div data-tab-panel="pd" class="mt-4"><div class="card"><div class="card-head"><h3 id="fyTitle"></h3><div class="tools"><button class="btn sm" id="nextFy"><i data-i="plus"></i>Open next fiscal year</button></div></div><div id="pd"></div></div></div>
  <div data-tab-panel="ap" class="mt-4"><div class="card"><div class="card-head"><div><h3>Approval policies</h3><p class="xs muted">Most specific match wins: template, then voucher type, then source, then priority. No levels means no approval.</p></div><div class="tools"><button class="btn sm primary" id="addAp"><i data-i="plus"></i>New policy</button></div></div><div id="ap"></div></div></div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); }, A = UI.acc(), b = A.book;
  document.querySelectorAll('.home').forEach(function (a) { a.href = A.home; });
  $('sub').textContent = b.name + ' · ' + (A.platform ? 'ChitSphere’s own books' : 'your organisation’s books');
  $('bkForm').innerHTML = UI.form([{ id: 'name', label: 'Legal name', req: true, span: 2 }, { id: 'gstin', label: 'GSTIN', mono: true, pattern: '[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]', err: '15-character GSTIN' },
    { id: 'cashSharePolicy', label: 'When a segment’s cash share would go negative', type: 'select', enum: 'CashSharePolicy', hint: 'Block refuses the posting; Warn allows it with a warning' },
    { id: 'allowSelfApproval', label: 'Let people approve vouchers they created', type: 'switch', span: 2, hint: 'Off is safer: every voucher needs a second person' }]);
  UI.fill($('bkForm'), b);
  $('bkFixed').innerHTML = UI.kv([['Book code', '<span class="mono">' + b.code + '</span>'], ['Chart template', UI.human(b.template)], ['Currency', b.baseCurrency], ['Fiscal year starts', ['', 'January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'][b.fiscalYearStartMonth]], ['Books from', UI.date(b.booksFrom)]]);
  $('saveBk').addEventListener('click', function () { UI.toast('Book settings saved (PUT ' + A.base + '/book with version)', 'success'); });
  $('fyTitle').textContent = 'Fiscal year ' + b.currentFiscalYear;
  var firstOpen = DB.periods.find(function (p) { return p.status === 'OPEN'; });
  UI.table({ el: '#pd', rows: DB.periods, pageSize: 12, columns: [
    { key: 'periodNo', label: '#', num: true }, { key: 'label', label: 'Month', render: function (p) { return '<b>' + p.label + '</b>'; } },
    { key: 'startDate', label: 'Starts', render: function (p) { return UI.date(p.startDate); } },
    { key: 'status', label: 'Status', render: function (p) { return UI.badge(p.status) + (p.closedBy ? '<div class="xs muted">by ' + p.closedBy + '</div>' : ''); } },
    { key: 'x', label: '', render: function (p) { return p.status === 'OPEN' ? (p === firstOpen ? '<button class="btn sm" data-act="close" data-id="' + p.id + '">Close</button>' : '') : (p.periodNo === firstOpen.periodNo - 1 ? '<button class="btn sm ghost" data-act="reopen" data-id="' + p.id + '">Reopen</button>' : ''); } }] });
  $('nextFy').addEventListener('click', function () { UI.confirm('Open fiscal year 2027-28?', 'Twelve new monthly periods are created. The current year stays open until you close its periods.', { ok: 'Open year', api: 'POST ' + A.base + '/fiscal-years/next', done: 'FY 2027-28 opened' }); });
  UI.table({ el: '#ap', rows: DB.policies, columns: [
    { key: 'name', label: 'Policy', render: function (p) { return '<b>' + UI.esc(p.name) + '</b><div class="xs muted">Priority ' + p.priority + '</div>'; } },
    { key: 'voucherType', label: 'Applies to', render: function (p) { return p.templateCode ? 'Template <span class="mono">' + p.templateCode + '</span>' : p.voucherType ? UI.human(p.voucherType) + ' vouchers' : 'All'; } },
    { key: 'minAmount', label: 'Amount', render: function (p) { return 'Over ' + UI.inrShort(p.minAmount) + (p.maxAmount ? ' up to ' + UI.inrShort(p.maxAmount) : ''); } },
    { key: 'levels', label: 'Levels', render: function (p) { return p.levels.length ? p.levels.map(function (l) { return '<span class="badge">L' + l + ' ' + ['', 'Branch manager', 'Finance manager', 'Director'][l] + '</span>'; }).join(' ') : '<span class="muted">Posts directly</span>'; } },
    { key: 'status', label: 'Status', render: function (p) { return UI.badge(p.status); } },
    { key: 'x', label: '', render: function (p) { return p.status === 'ACTIVE' ? '<button class="btn sm danger-ghost" data-act="deact" data-id="' + p.id + '">Deactivate</button>' : ''; } }] });
  $('addAp').addEventListener('click', function () {
    UI.dialog({ drawer: true, title: 'New approval policy', icon: 'checkSquare', api: 'POST ' + A.base + '/approval-policies', done: 'Policy created', fields: [
      { id: 'name', label: 'Name', req: true, span: 2 }, { id: 'voucherType', label: 'Voucher type', type: 'select', enum: 'VoucherType', blank: 'Any' },
      { id: 'templateCode', label: 'Template', type: 'select', options: DB.postingTemplates.map(function (t) { return [t.code, t.label]; }), blank: 'Any' },
      { id: 'minAmount', label: 'More than (₹)', type: 'number', req: true, min: 0, value: 0 }, { id: 'maxAmount', label: 'Up to (₹)', type: 'number', min: 0.01, hint: 'Blank means no upper limit' },
      { id: 'levels', label: 'Approval levels, in order', type: 'checks', span: 2, options: [['1', 'Level 1 · branch manager'], ['2', 'Level 2 · finance manager'], ['3', 'Level 3 · director']] },
      { id: 'priority', label: 'Priority', type: 'number', min: 0, max: 1000, value: 100, hint: 'Lower wins a tie' }] });
  });
  UI.onAct(function (act, id) {
    var p = DB.periods.find(function (x) { return x.id === id; });
    if (act === 'close') UI.confirm('Close ' + p.label + '?', 'No voucher can be posted, reversed or approved with a date in this month after it closes. Submitted vouchers dated in it must be dealt with first.', { ok: 'Close period', danger: true, api: 'POST ' + A.base + '/periods/{periodId}/close', done: p.label + ' closed' });
    if (act === 'reopen') UI.confirm('Reopen ' + p.label + '?', 'Only the latest closed month can be reopened. This is recorded in the audit log.', { ok: 'Reopen', api: 'POST ' + A.base + '/periods/{periodId}/reopen', done: p.label + ' reopened' });
    if (act === 'deact') { var ap = DB.policies.find(function (x) { return x.id === id; }); UI.confirm('Deactivate “' + ap.name + '”?', 'Vouchers already submitted keep their levels. New ones fall to the next matching policy.', { ok: 'Deactivate', danger: true, api: 'POST ' + A.base + '/approval-policies/{policyId}/deactivate', done: 'Policy deactivated' }); }
  });
});
</script>
</body>
</html>
