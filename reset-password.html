<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set password · ChitSphere</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/site.css">
</head>
<!--
  Opened from the emailed link: reset-password.html?token=...  (&mode=activate for a new account).
  POST /api/auth/v1/password/reset {token, newPassword}. The same call activates PENDING_ACTIVATION users.
  Tokens work once and expire after 30 minutes; ?token=expired shows that state.
-->
<body class="simple">
<div class="row" style="justify-content:space-between;padding:16px 20px">
  <a class="row small muted" href="login.html" style="gap:6px"><i data-i="arrowL" class="sm"></i>Back to sign in</a>
  <div class="row"><button class="icon-btn" data-theme-toggle aria-label="Toggle dark mode"></button></div>
</div>
<main class="simple-main" style="align-items:flex-start;padding-top:24px">
  <div class="simple-card">
    <div class="org-brand">
      <div class="logo" style="background:var(--primary)"><i data-i="shieldCheck" class="lg"></i></div>
      <div><h1 style="font-size:24px" id="h">Set a new password</h1><p class="muted mt-1" id="sub">Choose a strong password you don’t use anywhere else.</p></div>
    </div>
    <div class="card"><div class="card-body">
      <div id="bad" class="hidden stack">
        <div class="alert danger"><i data-i="alert"></i><div><b>This link has expired or was already used</b>Links work once and expire after 30 minutes. Request a new one.</div></div>
        <a class="btn primary block" href="forgot-password.html">Send a new link</a>
      </div>
      <form id="f" class="stack" novalidate>
        <div class="field"><label for="p1">New password</label><div class="input-icon"><i data-i="lock"></i><input class="input" type="password" id="p1" required autocomplete="new-password"></div>
          <ul class="pw-rules" id="rules"></ul><span class="err" id="p1err">Meet every rule above</span></div>
        <div class="field"><label for="p2">Confirm password</label><div class="input-icon"><i data-i="lock"></i><input class="input" type="password" id="p2" required autocomplete="new-password"></div><span class="err">Passwords don’t match</span></div>
        <button class="btn primary lg block" type="submit" id="go">Set password</button>
      </form>
    </div></div>
    <div class="powered"><span class="sb-logo" style="width:20px;height:20px;font-size:9px;border-radius:5px">CS</span>Powered by ChitSphere</div>
  </div>
</main>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  if (UI.param('token') === 'expired' || !UI.param('token')) { $('f').classList.add('hidden'); $('bad').classList.remove('hidden'); return; }
  if (UI.param('mode') === 'activate') { $('h').textContent = 'Activate your account'; $('sub').textContent = 'Welcome to ChitSphere. Set a password to finish activating your account.'; $('go').textContent = 'Activate account'; }
  var ok = UI.pwRules($('p1'), $('rules'), function () { return ['ravi', 'kumar', 'ravi@svchits.in']; });
  $('f').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!UI.validate(this)) return;
    var good = ok(); $('p1').closest('.field').classList.toggle('invalid', !good);
    var same = $('p1').value === $('p2').value; $('p2').closest('.field').classList.toggle('invalid', !same);
    if (good && same) location.href = 'login.html?reset=1';
  });
});
</script>
</body>
</html>
