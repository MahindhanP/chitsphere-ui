<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Branches · Sri Venkata Chits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<!--
  /api/platform/v1/tenants/{tenantId}/branches: list, POST {code, name, city, parentBranchId}, PUT, POST …/archive.
  Code: 2-20 letters, digits or hyphens, starting with a letter or digit.
-->
<body data-portal="tenant" data-page="branches">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a href="dashboard.html">Home</a><i data-i="chevR"></i>Settings<i data-i="chevR"></i>Branches</div>
      <h1>Branches</h1>
      <p>Offices of your organisation. Members, customers, groups, leads and payroll are tied to a branch. <b id="usage"></b></p>
    </div>
    <div class="actions"><button class="btn primary" id="add"><i data-i="plus"></i>Add branch</button></div>
  </div>
  <div class="card">
    <div class="toolbar"><div class="input-icon"><i data-i="search"></i><input class="input" id="q" placeholder="Search branches…"></div><select class="select" id="fStatus"><option value="">All statuses</option><option value="ACTIVE">Active</option><option value="ARCHIVED">Archived</option></select></div>
    <div id="tbl"></div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  var lim = DB.entitlement.limits.filter(function (l) { return l.id === 'platform.branch.max'; })[0];
  $('usage').textContent = lim.used + ' of ' + lim.limit + ' branches used on your plan.';
  var count = function (b, list) { return list.filter(function (x) { return x.branchId === b.id; }).length; };
  UI.table({ el: '#tbl', rows: DB.branches, search: '#q', searchKeys: ['name', 'code', 'city'], filters: [{ el: '#fStatus', key: 'status' }], onRow: function (b) { if (b.status === 'ACTIVE') form(b); },
    columns: [
      { key: 'name', label: 'Branch', sort: true, render: function (b) { return UI.ent(b.name, b.parentBranchId ? 'Under ' + DB.branchName(b.parentBranchId) : 'Top level', b.code); } },
      { key: 'city', label: 'City', sort: true },
      { key: 'g', label: 'Groups', num: true, render: function (b) { return count(b, DB.groups); } },
      { key: 'c', label: 'Customers', num: true, render: function (b) { return count(b, DB.customers); } },
      { key: 'm', label: 'Members', num: true, render: function (b) { return DB.memberships.filter(function (m) { return m.branchScope === 'TENANT' || m.branchIds.indexOf(b.id) > -1; }).length; } },
      { key: 'status', label: 'Status', render: function (b) { return UI.badge(b.status); } },
      { key: 'x', label: '', cls: 'actions-cell', render: function (b) { return b.status === 'ACTIVE' ? UI.rowMenu('rm_' + b.id, [['edit', 'Edit', false, 'edit'], b.code === 'AMP' ? null : ['archive', 'Archive', true, 'trash']]) : ''; } }] });
  function form(b) {
    UI.dialog({ drawer: true, title: b ? 'Edit ' + b.name : 'Add branch', icon: 'pin', api: b ? 'PUT …/branches/{branchId}' : 'POST /api/platform/v1/tenants/{tenantId}/branches', done: 'Branch saved', record: b,
      fields: [{ id: 'name', label: 'Branch name', req: true, span: 2 }, { id: 'code', label: 'Code', req: true, mono: true, pattern: '[A-Za-z0-9][A-Za-z0-9-]{1,19}', err: '2–20 letters, digits or hyphens', hint: 'Unique in your organisation' },
        { id: 'city', label: 'City', req: true }, { id: 'parentBranchId', label: 'Parent branch', type: 'select', span: 2, options: DB.branches.filter(function (x) { return x.status === 'ACTIVE' && (!b || x.id !== b.id); }).map(function (x) { return [x.id, x.name]; }), blank: 'None (top level)' }] });
  }
  $('add').addEventListener('click', function () { if (lim.used >= lim.limit) return UI.toast('Branch limit reached (PLAN_LIMIT_EXCEEDED)', 'danger'); form(null); });
  UI.onAct(function (act, id) {
    var b = DB.branch(id);
    if (act === 'edit') form(b);
    if (act === 'archive') UI.confirm('Archive ' + b.name + '?', 'It disappears from pickers. Records stay. A branch with active groups or employees can’t be archived.', { danger: true, ok: 'Archive', api: 'POST …/branches/{branchId}/archive', done: 'Branch archived' });
  });
});
</script>
</body>
</html>
