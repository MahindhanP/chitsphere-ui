<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plan & usage · Sri Venkata Chits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<!--
  GET /api/platform/v1/tenants/{tenantId}/entitlements (plan, subscription status, access mode, modules, limits with used/level)
  and GET …/capabilities. Read-only for tenants: plans are changed by ChitSphere. There is no billing or invoice API.
-->
<body data-portal="tenant" data-page="subscription">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a href="dashboard.html">Home</a><i data-i="chevR"></i>Settings<i data-i="chevR"></i>Plan & usage</div>
      <h1>Plan & usage</h1>
      <p>What your organisation can use and how much of it you are using.</p>
    </div>
    <div class="actions"><a class="btn" href="mailto:support@chitsphere.in"><i data-i="mail"></i>Ask to change plan</a></div>
  </div>
  <div id="banner"></div>
  <div class="grid g-4" id="kpis"></div>
  <div class="grid g-main-side mt-4">
    <div class="card"><div class="card-head"><div class="card-title-icon"><i data-i="activity"></i></div><div><h3>Limits</h3><div class="sub">Warnings start at 80%. At 100% new records are blocked (PLAN_LIMIT_EXCEEDED).</div></div></div><div class="card-body stack" id="lims"></div></div>
    <div class="card"><div class="card-head"><div class="card-title-icon"><i data-i="layers"></i></div><div><h3>Products & modules</h3></div></div><div class="card-body" id="mods"></div></div>
  </div>
  <div class="card mt-4"><div class="card-head"><h3>What each subscription status means</h3></div><div class="card-body"><div class="grid g-4" id="legend"></div></div></div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  var e = DB.entitlement, t = DB.tenant('t-svchits');
  $('kpis').innerHTML = [['Plan', UI.human(e.planCode) + ' · v' + e.planVersion], ['Subscription', UI.badge(e.subscriptionStatus)], ['Access', UI.badge(e.accessMode)], ['Renews / ends', UI.date(t.sub.endsOn)]].map(function (k) {
    return '<div class="card kpi"><div class="label">' + k[0] + '</div><div class="value" style="font-size:20px">' + k[1] + '</div></div>';
  }).join('');
  $('lims').innerHTML = e.limits.map(function (l) { var lv = DB.level(l); return '<div>' + UI.meter(l.label, l.used, l.limit) + '<div class="row between xs muted mt-1"><span class="mono">' + l.id + '</span><span>' + (l.override ? '<span class="badge hl">Temporary increase until 31 Jan 2027</span> ' : '') + (lv !== 'OK' ? UI.badge(lv) : '') + '</span></div></div>'; }).join('');
  var near = e.limits.filter(function (l) { return DB.level(l) !== 'OK' && DB.level(l) !== 'UNLIMITED'; }).map(function (l) { return l.label; });
  if (near.length) $('banner').innerHTML = '<div class="alert warning mb-4">' + UI.icon('alert') + '<div><b>Close to a limit</b>' + near.join(', ') + ' above 80% of your plan.</div></div>';
  $('mods').innerHTML = DB.catalog.filter(function (p) { return p.status !== 'DISABLED'; }).map(function (p) {
    return '<div class="perm-group"><h4>' + p.label + '</h4>' + p.modules.map(function (m) {
      var on = p.always || DB.enabledModules.indexOf(m.id) > -1, ov = /^payroll/.test(m.id);
      return '<div class="row between small" style="padding:3px 0"><span>' + m.label + '</span>' + (on ? (ov ? '<span class="badge hl">Trial until 31 Dec</span>' : UI.badge('ACTIVE')) : '<span class="badge outline">Not in plan</span>') + '</div>';
    }).join('') + '</div>';
  }).join('');
  var leg = [['TRIALING', 'Full access during the trial.'], ['ACTIVE', 'Full access.'], ['PAST_DUE', 'Payment overdue; read-only soon.'], ['GRACE', 'Read-only until the grace period ends.'], ['SUSPENDED', 'No access until ChitSphere restores it.'], ['TRIAL_EXPIRED', 'Read-only until a plan is activated.'], ['CANCELED', 'Ends at the end of the term.'], ['ENDED', 'No access.']];
  $('legend').innerHTML = leg.map(function (l) { return '<div>' + UI.badge(l[0]) + '<div class="xs muted mt-1">' + l[1] + '</div></div>'; }).join('');
});
</script>
</body>
</html>
