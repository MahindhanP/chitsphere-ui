<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Salary structures · Sri Venkata Chits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<!--
  /api/payroll/v1/tenants/{tenantId}/employees/{employeeId}/salary-structures: GET history, POST {effectiveFrom, basic, hra,
  allowances, fixedDeductions, pfApplicable} (a new effectiveFrom supersedes the previous structure).
-->
<body data-portal="tenant" data-page="salaries">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a href="dashboard.html">Home</a><i data-i="chevR"></i>Payroll<i data-i="chevR"></i>Salary structures</div>
      <h1>Salary structures</h1>
      <p>Monthly pay per employee. A new structure applies from its effective date.</p>
    </div>
  </div>
  <div class="card">
    <div class="toolbar"><div class="input-icon"><i data-i="search"></i><input class="input" id="q" placeholder="Search employee…"></div><select class="select" id="fBr"></select></div>
    <div id="tbl"></div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  var rows = DB.employees.filter(function (e) { return e.status !== 'EXITED'; }).map(function (e) {
    var s = DB.salaryStructures.find(function (x) { return x.employeeId === e.id; });
    return Object.assign({ name: e.fullName, code: e.code, branchId: e.branchId, id: e.id }, s || {});
  });
  $('fBr').innerHTML = UI.options({ options: DB.branches.map(function (b) { return [b.id, b.name]; }), blank: 'All branches' });
  UI.table({ el: '#tbl', rows: rows, search: '#q', searchKeys: ['name', 'code'], filters: [{ el: '#fBr', key: 'branchId' }], columns: [
    { key: 'name', label: 'Employee', sort: true, render: function (r) { return '<b>' + r.name + '</b><div class="xs muted"><span class="mono">' + r.code + '</span> · ' + DB.branchName(r.branchId) + '</div>'; } },
    { key: 'effectiveFrom', label: 'Effective from', render: function (r) { return r.effectiveFrom ? UI.date(r.effectiveFrom) : '<span class="badge warning">No structure</span>'; } },
    { key: 'basic', label: 'Basic', num: true, render: function (r) { return r.basic != null ? UI.inr(r.basic) : '—'; } },
    { key: 'hra', label: 'HRA', num: true, render: function (r) { return r.hra != null ? UI.inr(r.hra) : '—'; } },
    { key: 'allowances', label: 'Allowances', num: true, render: function (r) { return r.allowances != null ? UI.inr(r.allowances) : '—'; } },
    { key: 'monthlyGross', label: 'Monthly gross', num: true, sort: true, render: function (r) { return r.monthlyGross ? '<b>' + UI.inr(r.monthlyGross) + '</b>' : '—'; } },
    { key: 'pfApplicable', label: 'PF', render: function (r) { return r.effectiveFrom ? (r.pfApplicable ? 'Yes' : 'No') : ''; } },
    { key: 'x', label: '', render: function (r) { return '<button class="btn sm" data-act="rev" data-id="' + r.id + '">' + (r.effectiveFrom ? 'Revise' : 'Add') + '</button>'; } }] });
  UI.onAct(function (act, id) {
    if (act !== 'rev') return; var r = rows.find(function (x) { return x.id === id; });
    UI.dialog({ title: (r.effectiveFrom ? 'Revise salary · ' : 'Add salary · ') + r.name, icon: 'wallet', api: 'POST …/employees/{employeeId}/salary-structures', done: 'Salary structure saved',
      text: r.effectiveFrom ? 'The current structure (from ' + UI.date(r.effectiveFrom) + ') stays in history.' : null,
      fields: [{ id: 'effectiveFrom', label: 'Effective from', type: 'date', req: true, value: '2026-12-01' }, { id: 'pfApplicable', label: 'Provident fund applies', type: 'switch', value: r.pfApplicable !== false },
        { id: 'basic', label: 'Basic (₹/month)', type: 'number', req: true, min: 0, value: r.basic }, { id: 'hra', label: 'HRA', type: 'number', min: 0, value: r.hra },
        { id: 'allowances', label: 'Allowances', type: 'number', min: 0, value: r.allowances }, { id: 'fixedDeductions', label: 'Fixed deductions', type: 'number', min: 0, value: r.fixedDeductions, hint: 'e.g. professional tax' }] });
  });
});
</script>
</body>
</html>
