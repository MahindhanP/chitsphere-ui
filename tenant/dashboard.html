<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Sri Venkata Chits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-portal="tenant" data-page="dashboard">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs">Sri Venkata Chits</div>
      <h1>Good morning, Ravi</h1>
      <p>What needs you today across chits, customers, people and books.</p>
    </div>
    <div class="actions"><a class="btn" href="customers.html?new=1"><i data-i="plus"></i>Customer</a><a class="btn primary" href="group-new.html"><i data-i="plus"></i>Chit group</a></div>
  </div>
  <div class="grid g-4" id="kpis"></div>
  <div class="grid g-main-side mt-4">
    <div class="stack-lg">
      <div class="card">
        <div class="card-head"><div class="card-title-icon"><i data-i="grid"></i></div><div><h3>Groups forming</h3><div class="sub">Enrolment towards the scheme’s minimum to commence</div></div><div class="tools"><a class="btn ghost sm" href="groups.html">All groups</a></div></div>
        <div class="list" id="forming"></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title-icon"><i data-i="checkSquare"></i></div><div><h3>Waiting for you</h3></div></div>
        <div class="list" id="todo"></div>
      </div>
    </div>
    <div class="stack-lg">
      <div class="card">
        <div class="card-head"><div class="card-title-icon"><i data-i="card"></i></div><div><h3>Plan & usage</h3><div class="sub" id="planSub"></div></div><div class="tools"><a class="btn ghost sm" href="subscription.html">Details</a></div></div>
        <div class="card-body stack" id="usage"></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="card-title-icon"><i data-i="clock"></i></div><div><h3>Attendance today</h3></div><div class="tools"><a class="btn ghost sm" href="attendance.html">Open</a></div></div>
        <div class="card-body" id="att"></div>
      </div>
    </div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  var kpi = function (ico, cls, label, val, delta, href) { return '<a class="card kpi" href="' + href + '" style="color:inherit;text-decoration:none"><div class="label"><span class="ico ' + cls + '">' + UI.icon(ico) + '</span>' + label + '</div><div class="value">' + val + '</div><div class="delta">' + delta + '</div></a>'; };
  var g = DB.groups, open = DB.leads.filter(function (l) { return !/WON|LOST/.test(l.status); });
  $('kpis').innerHTML =
    kpi('grid', '', 'Chit groups', g.filter(function (x) { return x.status === 'COMMENCED'; }).length + ' running', g.filter(function (x) { return x.status === 'FORMING'; }).length + ' forming', 'groups.html') +
    kpi('idCard', 'hl', 'Customers', UI.num(4210), DB.customers.filter(function (c) { return c.createdAt > '2026-10-15'; }).length + ' added in the last 30 days', 'customers.html') +
    kpi('target', 'ok', 'Open leads', open.length, UI.inrShort(open.reduce(function (s, l) { return s + (l.expectedValue || 0); }, 0)) + ' expected value', 'pipeline.html') +
    kpi('users', 'warn', 'Employees', DB.employees.filter(function (e) { return e.status !== 'EXITED'; }).length, '1 on notice', 'employees.html');
  $('forming').innerHTML = g.filter(function (x) { return x.status === 'FORMING'; }).map(function (x) {
    var pct = Math.round(x.enrolled / x.installments * 100);
    return '<a class="list-item" href="group-view.html?id=' + x.id + '" style="color:inherit;text-decoration:none"><span class="avatar sq sm" style="background:' + x.color + ';color:#fff">' + x.installments + '</span><div style="flex:1;min-width:0"><b class="small">' + x.name + ' <span class="mono xs muted">' + x.code + '</span></b>' +
      '<div class="meter-bar mt-1"><div class="meter-fill ' + (x.commencementBlockers.length ? 'warn' : 'ok') + '" style="width:' + pct + '%"></div></div><div class="xs muted mt-1">' + x.enrolled + ' of ' + x.installments + ' tickets · ' + (x.commencementBlockers[0] || 'Ready to commence') + '</div></div><span class="xs muted">Starts ' + UI.date(x.startsOn) + '</span></a>';
  }).join('');
  var todo = [
    ['checkSquare', DB.journal.filter(function (j) { return j.status === 'SUBMITTED'; }).length + ' vouchers waiting for approval', '../accounting/approvals.html'],
    ['calendar', DB.leaveRequests.filter(function (l) { return l.status === 'PENDING'; }).length + ' leave requests to decide', 'leave.html'],
    ['alert', DB.followUps.filter(function (f) { return f.overdue; }).length + ' follow-ups overdue', 'follow-ups.html'],
    ['coins', 'Payroll Warangal 2026-10 is calculated; it needs a different approver than the preparer', 'payroll-run.html?id=pr-3'],
    ['lock', 'Naresh B is locked out after 5 failed sign-ins', 'members.html']
  ];
  $('todo').innerHTML = todo.map(function (t) { return '<a class="list-item" href="' + t[2] + '" style="color:inherit;text-decoration:none">' + UI.icon(t[0]) + '<span style="flex:1" class="small">' + t[1] + '</span>' + UI.icon('chevR', 'sm') + '</a>'; }).join('');
  var e = DB.entitlement;
  $('planSub').innerHTML = UI.human(e.planCode) + ' v' + e.planVersion + ' · ' + UI.badge(e.subscriptionStatus);
  $('usage').innerHTML = e.limits.filter(function (l) { return /user|customer|group|employee/.test(l.id); }).map(function (l) { return UI.meter(l.label, l.used, l.limit); }).join('');
  var a = {}; DB.attendanceToday.forEach(function (r) { var s = r.status || 'NOT_MARKED'; a[s] = (a[s] || 0) + 1; });
  $('att').innerHTML = '<div class="row wrap">' + Object.keys(a).map(function (s) { return (s === 'NOT_MARKED' ? '<span class="badge outline">Not marked</span>' : UI.badge(s)) + '<b class="small" style="margin-right:10px">' + a[s] + '</b>'; }).join('') + '</div>';
});
</script>
</body>
</html>
