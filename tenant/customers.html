<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customers · Sri Venkata Chits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<!--
  /api/customer/v1/tenants/{tenantId}/customers: list (branch-scoped), POST, GET, PUT, PATCH …/status {ACTIVE|INACTIVE}.
  The code (C000001…) is generated by the server. Postal code: 6 digits not starting with 0.
-->
<body data-portal="tenant" data-page="customers">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a href="dashboard.html">Home</a><i data-i="chevR"></i>Customers</div>
      <h1>Customers</h1>
      <p>People who subscribe to chits. A customer can hold tickets in many groups. <b id="usage"></b></p>
    </div>
    <div class="actions"><button class="btn primary" id="add"><i data-i="plus"></i>Add customer</button></div>
  </div>
  <div class="card">
    <div class="toolbar"><div class="input-icon"><i data-i="search"></i><input class="input" id="q" placeholder="Search name, code, phone, email…"></div><select class="select" id="fBranch"></select><select class="select" id="fStatus"></select></div>
    <div id="tbl"></div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  var lim = DB.entitlement.limits.filter(function (l) { return l.id === 'customer.record.max'; })[0];
  $('usage').textContent = UI.num(lim.used) + ' of ' + UI.num(lim.limit) + ' customers on your plan.';
  var brs = DB.branches.filter(function (b) { return b.status === 'ACTIVE'; }).map(function (b) { return [b.id, b.name]; });
  $('fBranch').innerHTML = UI.options({ options: brs, blank: 'All branches' });
  $('fStatus').innerHTML = UI.options({ enum: 'CustomerStatus', blank: 'All statuses' });
  UI.table({ el: '#tbl', rows: DB.customers, search: '#q', searchKeys: ['fullName', 'code', 'phone', 'email', 'city'], pageSize: 10, filters: [{ el: '#fBranch', key: 'branchId' }, { el: '#fStatus', key: 'status' }],
    onRow: function (c) { view(c); },
    columns: [
      { key: 'fullName', label: 'Customer', sort: true, render: function (c) { return UI.ent(c.fullName, '<span class="mono">' + c.code + '</span>'); } },
      { key: 'phone', label: 'Phone', render: function (c) { return UI.esc(c.phone) + (c.email ? '<div class="xs muted">' + UI.esc(c.email) + '</div>' : ''); } },
      { key: 'branchId', label: 'Branch', render: function (c) { return DB.branchName(c.branchId); } },
      { key: 'city', label: 'City', sort: true },
      { key: 'idProofType', label: 'ID proof', render: function (c) { return c.idProofType ? UI.human(c.idProofType) : '<span class="badge warning">Missing</span>'; } },
      { key: 'status', label: 'Status', render: function (c) { return UI.badge(c.status); } },
      { key: 'x', label: '', cls: 'actions-cell', render: function (c) { return UI.rowMenu('rm_' + c.id, [['edit', 'Edit', false, 'edit'], ['status', c.status === 'ACTIVE' ? 'Mark inactive' : 'Mark active', c.status === 'ACTIVE', 'refresh']]); } }] });
  function form(c) {
    UI.dialog({ drawer: true, wide: true, title: c ? 'Edit ' + c.fullName : 'Add customer', sub: c ? c.code : 'The customer code is assigned when you save', icon: 'idCard', record: c, done: 'Customer saved',
      api: c ? 'PUT …/customers/{customerId}' : 'POST /api/customer/v1/tenants/{tenantId}/customers',
      fields: [{ id: 'fullName', label: 'Full name', req: true, span: 2 }, { id: 'branchId', label: 'Branch', type: 'select', req: true, options: brs, blank: 'Select' }, { id: 'phone', label: 'Phone', type: 'tel', req: true },
        { id: 'alternatePhone', label: 'Alternate phone', type: 'tel' }, { id: 'email', label: 'Email', type: 'email' }, { id: 'dateOfBirth', label: 'Date of birth', type: 'date' }, { id: 'occupation', label: 'Occupation' },
        { section: 'Address' }, { id: 'addressLine', label: 'Address', span: 2 }, { id: 'city', label: 'City' }, { id: 'state', label: 'State' }, { id: 'postalCode', label: 'PIN code', mono: true, pattern: '[1-9][0-9]{5}', err: '6 digits, not starting with 0' },
        { section: 'Identity proof' }, { id: 'idProofType', label: 'ID proof type', type: 'select', enum: 'IdProofType', blank: 'None' }, { id: 'idProofNumber', label: 'ID proof number', mono: true }] });
  }
  function view(c) {
    var en = []; DB.groups.forEach(function (g) { if (g.status !== 'CANCELLED') DB.enrolmentsFor(g).forEach(function (e) { if (e.customerId === c.id && e.status === 'ACTIVE') en.push([g, e]); }); });
    UI.dialog({ drawer: true, wide: true, title: c.fullName, sub: c.code + ' · ' + DB.branchName(c.branchId), icon: 'idCard', ok: 'Edit',
      html: UI.kv([['Status', UI.badge(c.status)], ['Phone', UI.esc(c.phone)], ['Alternate phone', UI.esc(c.alternatePhone)], ['Email', UI.esc(c.email)], ['Date of birth', c.dateOfBirth ? UI.date(c.dateOfBirth) : null], ['Occupation', UI.esc(c.occupation)],
        ['Address', [c.addressLine, c.city, c.state, c.postalCode].filter(Boolean).map(UI.esc).join(', ')], ['ID proof', c.idProofType ? UI.human(c.idProofType) + ' · <span class="mono">' + UI.esc(c.idProofNumber) + '</span>' : null], ['Added', UI.date(c.createdAt)]]) +
        '<h4 class="mt-6 mb-2">Chit tickets (' + en.length + ')</h4>' + (en.length ? en.map(function (x) { return '<a class="list-item" style="padding:8px 0;color:inherit" href="group-view.html?id=' + x[0].id + '"><b class="small" style="flex:1">' + x[0].name + ' <span class="mono xs muted">' + x[0].code + '</span></b><span class="small">Ticket ' + x[1].ticketNumber + '</span>' + UI.badge(x[0].status) + '</a>'; }).join('') : '<p class="small muted">No tickets yet.</p>'),
      onOk: function () { setTimeout(function () { form(c); }, 50); }, done: false });
  }
  $('add').addEventListener('click', function () { form(null); });
  if (UI.param('new')) form(null);
  UI.onAct(function (act, id) {
    var c = DB.customer(id);
    if (act === 'edit') form(c);
    if (act === 'status') UI.confirm(c.status === 'ACTIVE' ? 'Mark ' + c.fullName + ' inactive?' : 'Reactivate ' + c.fullName + '?', c.status === 'ACTIVE' ? 'Inactive customers can’t be enrolled in new groups. Existing tickets are not affected.' : 'They can be enrolled again.', { api: 'PATCH …/customers/{id}/status', done: 'Status changed' });
  });
});
</script>
</body>
</html>
