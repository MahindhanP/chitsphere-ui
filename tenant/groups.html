<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chit groups · Sri Venkata Chits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/app.css">
</head>
<!--
  GET /api/chits/v1/tenants/{tenantId}/groups. Status: FORMING (enrolling) → COMMENCED, or CANCELLED.
-->
<body data-portal="tenant" data-page="groups">
<main class="content">
  <div class="page-head">
    <div class="titles">
      <div class="crumbs"><a href="dashboard.html">Home</a><i data-i="chevR"></i>Chits<i data-i="chevR"></i>Groups</div>
      <h1>Chit groups</h1>
      <p>Each group runs one scheme with its own members and tickets. <b id="usage"></b></p>
    </div>
    <div class="actions"><a class="btn primary" href="group-new.html"><i data-i="plus"></i>New group</a></div>
  </div>
  <div class="grid g-3" id="kpis"></div>
  <div class="card mt-4">
    <div class="toolbar"><div class="input-icon"><i data-i="search"></i><input class="input" id="q" placeholder="Search code or name…"></div><select class="select" id="fStatus"></select><select class="select" id="fScheme"></select><select class="select" id="fBranch"></select></div>
    <div id="tbl"></div>
  </div>
</main>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/app.js"></script>
<script>
document.addEventListener('app:ready', function () {
  var $ = function (id) { return document.getElementById(id); };
  var lim = DB.entitlement.limits.filter(function (l) { return l.id === 'chits.group.max'; })[0];
  $('usage').textContent = lim.used + ' of ' + lim.limit + ' groups on your plan.';
  $('kpis').innerHTML = DB.ENUM.ChitGroupStatus.map(function (st) { var n = DB.groups.filter(function (g) { return g.status === st; }).length; return '<div class="card kpi"><div class="label">' + UI.badge(st) + '</div><div class="value">' + n + '</div></div>'; }).join('');
  $('fStatus').innerHTML = UI.options({ enum: 'ChitGroupStatus', blank: 'All statuses' });
  $('fScheme').innerHTML = UI.options({ options: DB.schemes.map(function (s) { return [s.id, s.name]; }), blank: 'All schemes' });
  $('fBranch').innerHTML = UI.options({ options: DB.branches.map(function (b) { return [b.id, b.name]; }), blank: 'All branches' });
  UI.table({ el: '#tbl', rows: DB.groups, search: '#q', searchKeys: ['code', 'name', 'schemeCode'], filters: [{ el: '#fStatus', key: 'status' }, { el: '#fScheme', key: 'schemeId' }, { el: '#fBranch', key: 'branchId' }],
    onRow: function (g) { location.href = 'group-view.html?id=' + g.id; },
    columns: [
      { key: 'code', label: 'Group', sort: true, render: function (g) { return UI.ent(g.name, '<span class="mono">' + g.code + '</span>', g.installments, g.color); } },
      { key: 'schemeCode', label: 'Scheme', render: function (g) { return '<span class="mono xs">' + g.schemeCode + '</span><div class="xs muted">' + UI.inrShort(g.chitValue) + ' · ' + UI.human(g.auctionFrequency).toLowerCase() + '</div>'; } },
      { key: 'branchId', label: 'Branch', render: function (g) { return DB.branchName(g.branchId); } },
      { key: 'enrolled', label: 'Tickets', render: function (g) { var p = Math.round(g.enrolled / g.installments * 100); return '<div style="min-width:120px"><div class="row between xs"><span>' + g.enrolled + ' / ' + g.installments + '</span><span class="muted">' + g.vacant + ' vacant</span></div><div class="meter-bar mt-1"><div class="meter-fill' + (g.status === 'FORMING' && g.commencementBlockers.length ? ' warn' : '') + '" style="width:' + p + '%"></div></div></div>'; } },
      { key: 'startsOn', label: 'Starts', sort: true, render: function (g) { return UI.date(g.startsOn); } },
      { key: 'status', label: 'Status', render: function (g) { return UI.badge(g.status) + (g.status === 'FORMING' ? '<div class="xs muted">' + (g.commencementBlockers.length ? 'Not ready' : 'Ready to commence') + '</div>' : ''); } }] });
});
</script>
</body>
</html>
